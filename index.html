<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TWWTS Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a0a0a;--card:#131313;--card2:#1a1a1a;--border:rgba(255,255,255,0.08);
--text:#fff;--text2:rgba(255,255,255,0.55);--text3:rgba(255,255,255,0.25);
--gold:#d4a843;
}
html,body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;
overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100dvh}

/* HEADER */
.hdr{position:sticky;top:0;z-index:100;background:rgba(10,10,10,0.95);
backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
padding:env(safe-area-inset-top,8px) 16px 0;border-bottom:1px solid var(--border)}
.hdr-top{display:flex;justify-content:space-between;align-items:center;padding:10px 0 6px}
.logo{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--text2)}
.logo b{color:var(--text);font-size:12px;letter-spacing:0.15em}
.hdr-actions{display:flex;gap:10px}
.hdr-btn{font-size:18px;cursor:pointer;padding:4px;opacity:0.4;transition:opacity .2s}
.hdr-btn:active{opacity:1}

.srch{position:relative;margin-bottom:8px}
.srch input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;
padding:9px 12px 9px 34px;color:var(--text);font-size:15px;font-family:inherit;outline:none}
.srch input:focus{border-color:rgba(255,255,255,0.2);background:rgba(255,255,255,0.07)}
.srch-i{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:14px;opacity:0.3}
.srch input::placeholder{color:var(--text3)}

.frow-wrap{display:flex;align-items:center}
.frow{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.frow::-webkit-scrollbar{display:none}
.flabel{font-size:9px;font-family:"Space Mono",monospace;text-transform:uppercase;
letter-spacing:0.12em;color:var(--text3);flex-shrink:0;margin-right:6px;min-width:32px}
.ch{flex-shrink:0;padding:5px 10px;border-radius:16px;font-size:11px;font-weight:600;
border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none}
.ch.on{color:#000;border-color:transparent}
.ch[data-v="all"].on{background:#fff}
.ch[data-v="Microrealism"].on{background:#8b5cf6}
.ch[data-v="Etching / Engraving"].on{background:#22c55e}
.ch[data-v="Contemporary / Abstract"].on{background:#3b82f6}
.ch[data-v="Ornamental / Botanical"].on{background:#f59e0b}
.ch[data-v="Chrome / 3D"].on{background:#a855f7}
.ch[data-v="Smoke / Fluid / Pop"].on{background:#ef4444}
.ch[data-v="Illustrative / Conceptual"].on{background:#ec4899}
.ch[data-v="Multi-style"].on{background:#6b7280;color:#fff}
.ch[data-v="Mix Stili"].on{background:#78716c;color:#fff}
.ch[data-v="s-all"].on{background:#fff}
.ch[data-v="s-new"].on{background:#555;color:#fff}
.ch[data-v="s-check"].on{background:#3b82f6}
.ch[data-v="s-sent"].on{background:#f59e0b}
.ch[data-v="s-conf"].on{background:#22c55e}
.ch[data-v="s-maybe"].on{background:#a855f7}
.ch[data-v="s-no"].on{background:#ef4444}

/* TAB BAR */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:0}
.tab{flex:1;text-align:center;padding:10px 0;font-size:12px;font-weight:600;color:var(--text3);
cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;font-family:"Space Mono",monospace;
letter-spacing:0.05em;text-transform:uppercase}
.tab.on{color:var(--text);border-bottom-color:var(--text)}
.tab .cnt{font-size:10px;opacity:0.5;margin-left:4px}

/* STATS */
.stats{padding:6px 16px;font-size:10px;color:var(--text3);font-family:"Space Mono",monospace;
letter-spacing:0.04em;display:flex;justify-content:space-between}

/* CARDS */
.ls{padding:0 10px 140px}
.cd{background:var(--card);border:1px solid var(--border);border-radius:12px;
padding:12px;margin-bottom:6px;position:relative;transition:all .15s}
.cd:active{background:var(--card2)}
.cd.s-check{border-left:3px solid #3b82f6}
.cd.s-sent{border-left:3px solid #f59e0b}
.cd.s-conf{border-left:3px solid #22c55e}
.cd.s-no{opacity:0.35}
.cd.s-maybe{border-left:3px solid #a855f7}
.cd-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.handle{font-family:"Space Mono",monospace;font-size:13px;font-weight:700}
.foll{font-size:10px;color:var(--text3);font-family:"Space Mono",monospace}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.tg{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;
padding:2px 6px;border-radius:3px;color:var(--text2);background:rgba(255,255,255,0.05)}
.tg.cl{color:rgba(255,255,255,0.85)}
.tg.cl[data-c="Microrealism"]{background:rgba(139,92,246,0.2);color:#c4b5fd}
.tg.cl[data-c="Etching / Engraving"]{background:rgba(34,197,94,0.15);color:#86efac}
.tg.cl[data-c="Contemporary / Abstract"]{background:rgba(59,130,246,0.15);color:#93c5fd}
.tg.cl[data-c="Ornamental / Botanical"]{background:rgba(245,158,11,0.15);color:#fcd34d}
.tg.cl[data-c="Chrome / 3D"]{background:rgba(168,85,247,0.15);color:#d8b4fe}
.tg.cl[data-c="Smoke / Fluid / Pop"]{background:rgba(239,68,68,0.15);color:#fca5a5}
.tg.cl[data-c="Illustrative / Conceptual"]{background:rgba(236,72,153,0.15);color:#f9a8d4}
.tg.cl[data-c="Multi-style"]{background:rgba(107,114,128,0.15);color:#d1d5db}
.tg.cl[data-c="Mix Stili"]{background:rgba(120,113,108,0.15);color:#d6d3d1}
.tech{font-size:11px;color:var(--text2);line-height:1.35;margin-bottom:4px}
.nt{font-size:10px;color:var(--text3);line-height:1.3;margin-bottom:8px}

/* STATUS BUTTONS */
.sbar{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.sb{padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;
border:1px solid var(--border);color:var(--text3);transition:all .15s;user-select:none}
.sb:active{transform:scale(0.95)}
.sb.on{border-color:transparent;color:#000}
.sb[data-s="check"].on{background:#3b82f6;color:#fff}
.sb[data-s="sent"].on{background:#f59e0b}
.sb[data-s="conf"].on{background:#22c55e}
.sb[data-s="no"].on{background:#ef4444;color:#fff}
.sb[data-s="maybe"].on{background:#a855f7;color:#fff}

/* USER NOTE */
.unote{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);
border-radius:6px;padding:6px 8px;color:var(--text);font-size:11px;font-family:inherit;
outline:none;resize:none;min-height:28px;max-height:80px;display:none;margin-bottom:8px}
.unote:focus{border-color:rgba(255,255,255,0.2)}
.unote.vis{display:block}
.unote::placeholder{color:var(--text3)}

.acts{display:flex;gap:6px;align-items:center}
.btn-ig{display:flex;align-items:center;gap:4px;padding:7px 12px;border-radius:7px;
font-size:11px;font-weight:600;text-decoration:none;color:#fff;
background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);transition:opacity .15s}
.btn-ig:active{opacity:0.7}
.btn-note{padding:7px 10px;border-radius:7px;font-size:13px;cursor:pointer;
background:rgba(255,255,255,0.05);border:1px solid var(--border)}
.btn-note.has{color:var(--gold)}
.guest-info{font-size:10px;color:var(--text3);margin-left:auto;max-width:140px;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* REFERENCE CARDS */
.ref-card{background:rgba(212,168,67,0.06);border:1px solid rgba(212,168,67,0.15);border-radius:10px;
padding:10px 12px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ref-card.ref-warn{background:rgba(239,68,68,0.05);border-color:rgba(239,68,68,0.2)}
.ref-left{flex:1;min-width:0}
.ref-h{font-family:"Space Mono",monospace;font-size:12px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:5px}
.ref-warn-icon{font-size:10px;color:#ef4444;flex-shrink:0}
.ref-meta{font-size:10px;color:var(--text2)}
.ref-badge{font-size:9px;font-weight:700;padding:3px 8px;border-radius:10px;
background:rgba(212,168,67,0.2);color:var(--gold);white-space:nowrap}
.ref-ig{display:flex;align-items:center;padding:5px 8px;border-radius:6px;font-size:11px;
background:linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);color:#fff;text-decoration:none;flex-shrink:0}
.ref-ig:active{opacity:0.7}
.ref-month{display:inline-block;margin-top:6px;margin-bottom:10px;font-size:10px;font-family:"Space Mono",monospace;
text-transform:uppercase;letter-spacing:0.15em;color:var(--gold);padding:4px 10px;
border:1px solid rgba(212,168,67,0.2);border-radius:6px}

.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty b{display:block;font-size:32px;margin-bottom:8px}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;
align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#1a1a1a;border-radius:16px 16px 0 0;width:100%;max-width:480px;
padding:20px 16px env(safe-area-inset-bottom,20px);max-height:60vh;overflow-y:auto}
.modal h3{font-family:"Space Mono",monospace;font-size:12px;text-transform:uppercase;
letter-spacing:0.15em;color:var(--text2);margin-bottom:12px}
.modal .sr{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.modal .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:8px}
.modal .cbtn{margin-top:16px;width:100%;padding:12px;border-radius:10px;
background:rgba(255,255,255,0.08);color:var(--text);font-size:14px;font-weight:600;
border:none;cursor:pointer;font-family:inherit}

@media(min-width:500px){
.ls{max-width:480px;margin:0 auto}
.hdr>*{max-width:480px;margin-left:auto;margin-right:auto}
.stats{max-width:480px;margin:0 auto}
}
</style>
</head>

<div class="modal-bg" id="modalBg">
<div class="modal" id="modal"></div>
</div>

 qs("#btnReset").onclick=()=>{fC="all";fSt="s-all";query="";qs("#search").value="";
  qsa(".ch").forEach(x=>x.classList.remove("on"));
  qs('#f1 .ch[data-v="all"]').classList.add("on");qs('#f2 .ch[data-v="s-all"]').classList.add("on");render()};
 qs("#btnStats").onclick=showStats;
 qs("#modalBg").onclick=e=>{if(e.target.id==="modalBg")e.target.classList.remove("open")};
 qs("#tabScout").onclick=()=>switchTab("scout");
 qs("#tabRef").onclick=()=>switchTab("ref");
 qs("#cntScout").textContent=D.length;
 qs("#cntRef").textContent=R.length;
 render();
 renderRefs();
}

function switchTab(t){activeTab=t;
 qs("#tabScout").classList.toggle("on",t==="scout");
 qs("#tabRef").classList.toggle("on",t==="ref");
 qs("#scoutView").style.display=t==="scout"?"block":"none";
 qs("#refView").style.display=t==="ref"?"block":"none";
}

function mk(tag,cls){const e=document.createElement(tag);e.className=cls;return e}
function qs(s){return document.querySelector(s)}
function qsa(s){return document.querySelectorAll(s)}
function getSt(h){return (getS(h).status)||"new"}

function filtered(){
 return D.filter(a=>{
  if(fC!=="all"&&a.cl!==fC)return false;
  const st=getSt(a.h);
  if(fSt!=="s-all"){const need=fSt.replace("s-","");if(st!==need)return false}
  if(query){const s=(a.h+a.co+a.ci+a.st+a.te+a.n+a.cl+a.g+(getS(a.h).note||"")).toLowerCase();if(!s.includes(query))return false}
  return true;
 });
}

function render(){
 const items=filtered();
 const countries=new Set(items.map(a=>a.co)).size;
 qs("#stats").innerHTML=`<span>${items.length} prospect &middot; ${countries} paesi</span>`;
 const list=qs("#list");
 if(!items.length){list.innerHTML='<div class="empty"><b>&#128269;</b>Nessun risultato</div>';return}
 let h="";
 items.forEach((a,i)=>{
  const st=getSt(a.h);
  const stCls=st!=="new"?" s-"+st:"";
  const userNote=getS(a.h).note||"";
  const nVis=userNote?"vis":"";
  const nHas=userNote?"has":"";
  const cn=a.n?a.n.replace(/PAST GUEST (MAR|LUG) — /,""):"";
  const gi=a.g&&!a.g.includes("TWWTS")?'<span class="guest-info">'+esc(a.g)+'</span>':"";
  h+=`<div class="cd${stCls}">
<div class="cd-row1"><span class="handle">${esc(a.h)}</span><span class="foll">${esc(a.f)}</span></div>
<div class="tags"><span class="tg cl" data-c="${esc(a.cl)}">${esc(a.cl)}</span><span class="tg">${esc(a.co)}</span>${a.ci&&a.ci!=="—"?'<span class="tg">'+esc(a.ci)+'</span>':""}</div>
<div class="tech">${esc(a.te)}</div>
${cn?'<div class="nt">'+esc(cn)+'</div>':""}
<div class="sbar">
<div class="sb${st==="check"?" on":""}" data-s="check" onclick="doSt('${esc(a.h)}','check')">&#10003; Visto</div>
<div class="sb${st==="sent"?" on":""}" data-s="sent" onclick="doSt('${esc(a.h)}','sent')">&#9993; Scritto</div>
<div class="sb${st==="conf"?" on":""}" data-s="conf" onclick="doSt('${esc(a.h)}','conf')">&#10004; OK</div>
<div class="sb${st==="maybe"?" on":""}" data-s="maybe" onclick="doSt('${esc(a.h)}','maybe')">? Forse</div>
<div class="sb${st==="no"?" on":""}" data-s="no" onclick="doSt('${esc(a.h)}','no')">&#10007; No</div>
</div>
<textarea class="unote ${nVis}" placeholder="Nota personale..." data-h="${esc(a.h)}" oninput="saveN(this)">${esc(userNote)}</textarea>
<div class="acts">
<a class="btn-ig" href="${esc(a.l)}" target="_blank" rel="noopener">&#128247; IG</a>
<div class="btn-note ${nHas}" onclick="togN(this)">&#9998;</div>
${gi}</div></div>`;
 });
 list.innerHTML=h;
}

function renderRefs(){
 const months=["Febbraio","Marzo","Apr-Mag","Luglio"];
 let h="";
 months.forEach(m=>{
  const items=R.filter(r=>r.month===m);
  if(!items.length)return;
  const warnCount=items.filter(r=>r.warn).length;
  const warnNote=warnCount?` &middot; <span style="color:#ef4444;font-size:9px">${warnCount} da verificare</span>`:"";
  h+=`<span class="ref-month">${m} 2026 &middot; ${items.length} guest${warnNote}</span>`;
  items.forEach(r=>{
   const igHandle=r.h.replace(/^@/,"");
   const warnCls=r.warn?" ref-warn":"";
   const warnIcon=r.warn?`<span class="ref-warn-icon" title="Account non verificato">⚠</span>`:"";
   h+=`<div class="ref-card${warnCls}">
<div class="ref-left"><div class="ref-h">${esc(r.h)}${warnIcon}</div>
<div class="ref-meta">${esc(r.co)} &middot; ${esc(r.st)}</div></div>
<span class="ref-badge">${esc(r.g)}</span>
<a class="ref-ig" href="https://instagram.com/${esc(igHandle)}" target="_blank" rel="noopener">&#x1F517;</a></div>`;
  });
 });
 qs("#refList").innerHTML=h;
}

function doSt(h,s){const cur=getSt(h);setS(h,"status",cur===s?"new":s);render()}
function togN(btn){const ta=btn.closest(".cd").querySelector(".unote");ta.classList.toggle("vis");if(ta.classList.contains("vis"))ta.focus()}
function saveN(ta){setS(ta.dataset.h,"note",ta.value);ta.parentElement.querySelector(".btn-note").classList.toggle("has",!!ta.value)}

function showStats(){
 const c={new:0,check:0,sent:0,conf:0,maybe:0,no:0};
 D.forEach(a=>{const s=getSt(a.h);c[s]=(c[s]||0)+1});
 const col={new:"#555",check:"#3b82f6",sent:"#f59e0b",conf:"#22c55e",maybe:"#a855f7",no:"#ef4444"};
 const lb={new:"Da vedere",check:"Visti",sent:"Contattati",conf:"Confermati",maybe:"Forse",no:"No"};
 let h='<h3>Dashboard Scouting</h3>';
 for(const k of Object.keys(c)){h+=`<div class="sr"><span><span class="dot" style="background:${col[k]}"></span>${lb[k]}</span><span>${c[k]}</span></div>`}
 h+=`<div class="sr" style="font-weight:700;border:none"><span>Totale prospect</span><span>${D.length}</span></div>`;
 h+=`<div class="sr" style="border:none;color:var(--gold)"><span>Guest confermati (reference)</span><span>${R.length}</span></div>`;
 h+='<button class="cbtn" onclick="qs(\'#modalBg\').classList.remove(\'open\')">Chiudi</button>';
 qs("#modal").innerHTML=h;qs("#modalBg").classList.add("open");
}

function esc(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
init();
</script>
</body>
</html>
